[package]
name = "ath-hud"
version = "0.1.0"
description = "ath-hud - floating HUD for agent sessions"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ath_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tiny_http = "0.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
